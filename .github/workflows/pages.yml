name: Publicar Shiny R en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::ggplot2
            any::DT
            any::jsonlite
            any::svglite
      - name: Comprobar datos y aplicación
        run: Rscript tests/check-data.R
      - name: Verificar filtros, cálculos y descargas
        run: Rscript tests/test-server.R
      - name: Exportar Shiny para el navegador
        run: Rscript -e 'shinylive::export("app", "site", wasm_packages = TRUE, assets_version = "0.10.12")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
